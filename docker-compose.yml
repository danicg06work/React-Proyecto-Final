services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api
    container_name: react-proyecto-frontend
    ports:
      - "5173:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: react-proyecto-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
